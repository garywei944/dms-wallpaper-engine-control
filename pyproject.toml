# Tool settings for the bundled controller script; the plugin itself needs no Python packaging.

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.10"
scripts_are_modules = true
check_untyped_defs = true
